apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "python-platform.name" . }}-app
  labels:
    {{- include "python-platform.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
imagePullSecrets:
  {{- toYaml .Values.imagePullSecrets | nindent 2 }}
