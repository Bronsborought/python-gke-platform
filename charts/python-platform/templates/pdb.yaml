apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "python-platform.name" . }}
  labels:
    {{- include "python-platform.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "python-platform.selectorLabels" . | nindent 6 }}
