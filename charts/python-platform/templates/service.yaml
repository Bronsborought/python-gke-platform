apiVersion: v1
kind: Service
metadata:
  name: {{ include "python-platform.name" . }}
  labels:
    {{- include "python-platform.labels" . | nindent 4 }}
  {{- if .Values.ingress.enabled }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default":"{{ include "python-platform.name" . }}"}'
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "python-platform.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
