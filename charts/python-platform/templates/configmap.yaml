apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "python-platform.name" . }}
  labels:
    {{- include "python-platform.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.app.environment | quote }}
  LOG_LEVEL: {{ .Values.app.logLevel | quote }}
  PORT: {{ .Values.app.port | quote }}
  DATA_DIR: {{ .Values.app.dataDir | quote }}
