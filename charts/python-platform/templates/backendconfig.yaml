{{- if .Values.ingress.enabled }}
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ include "python-platform.name" . }}
  labels:
    {{- include "python-platform.labels" . | nindent 4 }}
spec:
  timeoutSec: 30
  connectionDraining:
    drainingTimeoutSec: 30
  healthCheck:
    type: HTTP
    requestPath: /ready
    port: {{ .Values.app.port }}
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
{{- end }}
