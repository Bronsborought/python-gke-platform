name: Release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      REGISTRY: trialokuvu3.jfrog.io
      IMAGE_REPO: trialokuvu3.jfrog.io/docker-local/python-gke-platform
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.JFROG_USERNAME }}
          password: ${{ secrets.JFROG_TOKEN }}
      - name: Compute immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r\n' < VERSION)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG="v${VERSION}-${RELEASE_SHA:0:12}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "ARCH_IMAGE=$IMAGE_REPO:$TAG-${{ matrix.arch }}" >> "$GITHUB_ENV"
      - name: Build one architecture
        run: |
          docker buildx build --platform linux/${{ matrix.arch }} \
            --load --provenance=false -t "$ARCH_IMAGE" .
      - name: Verify size and user
        shell: bash
        run: |
          set -euo pipefail
          size=$(docker image inspect "$ARCH_IMAGE" --format '{{.Size}}')
          echo "Uncompressed image bytes: $size"
          test "$size" -le 200000000
          test "$(docker run --rm --entrypoint id "$ARCH_IMAGE" -u)" = 10001
      - name: Scan the exact image to publish
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.ARCH_IMAGE }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          timeout: 10m0s
      - name: Push scanned architecture
        run: docker push "$ARCH_IMAGE"
  promote:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      IMAGE_REPO: trialokuvu3.jfrog.io/docker-local/python-gke-platform
      GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: trialokuvu3.jfrog.io
          username: ${{ secrets.JFROG_USERNAME }}
          password: ${{ secrets.JFROG_TOKEN }}
      - name: Assemble index and resolve digest
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r\n' < VERSION)
          TAG="v${VERSION}-${RELEASE_SHA:0:12}"
          docker buildx imagetools create -t "$IMAGE_REPO:$TAG" \
            "$IMAGE_REPO:$TAG-amd64" "$IMAGE_REPO:$TAG-arm64"
          docker buildx imagetools inspect "$IMAGE_REPO:$TAG"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE_REPO:$TAG" |
            awk '/^Digest:/ {print $2; exit}')
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: Bronsborought/python-gke-platform-gitops
          ref: main
          path: gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          persist-credentials: true
      - name: Open staging promotion PR
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/promote.py gitops staging "$TAG" "$DIGEST"
          cd gitops
          BRANCH="release/staging-${RELEASE_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add environments/staging/values.yaml
          if git diff --cached --quiet; then
            echo 'Staging already targets this digest'
            exit 0
          fi
          git commit -m "release: promoted staging to $TAG"
          git push -u origin "$BRANCH"
          printf 'Updated staging to `%s`.\n\nImage digest: `%s`\n\nSource commit: `%s`\n\nBoth image architectures passed the CRITICAL vulnerability gate.\n' \
            "$TAG" "$DIGEST" "$RELEASE_SHA" > /tmp/promotion-body.md
          gh pr create --repo Bronsborought/python-gke-platform-gitops \
            --base main --head "$BRANCH" --title "release: promoted staging to $TAG" \
            --body-file /tmp/promotion-body.md
