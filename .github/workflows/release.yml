name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.2.0)"
        required: true
        default: "v1.2.0"

permissions:
  contents: write

env:
  REGISTRY: trial2mrxfh.jfrog.io
  IMAGE_NAME: docker-local/python-platform-app

jobs:
  build-amd64:
    name: Build & Push (linux/amd64)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to JFrog Artifactory
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.JFROG_USER }}
          password: ${{ secrets.JFROG_TOKEN }}

      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}-amd64

      - name: Scan linux/amd64 release image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}-amd64
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  build-arm64:
    name: Build & Push Native ARM64 (RPi CM5)
    runs-on: [self-hosted, linux, arm64, rpi-cm5]
    needs: build-amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify native ARM64 hardware architecture
        run: |
          echo "Building natively on host: $(hostname) ($(uname -m))"
          cat /proc/device-tree/model && echo ""

      - name: Log in to JFrog Artifactory
        run: |
          echo "${{ secrets.JFROG_TOKEN }}" | docker login "${{ env.REGISTRY }}" -u "${{ secrets.JFROG_USER }}" --password-stdin

      - name: Build and push native linux/arm64 image
        run: |
          VERSION="${{ needs.build-amd64.outputs.version }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-arm64"
          docker build --platform linux/arm64 -t "${IMAGE}" .
          docker push "${IMAGE}"

  publish-multiarch:
    name: Assemble Multi-Arch Manifest & Promote to GitOps
    runs-on: ubuntu-24.04
    needs: [build-amd64, build-arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to JFrog Artifactory
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.JFROG_USER }}
          password: ${{ secrets.JFROG_TOKEN }}

      - name: Create and push multi-arch OCI manifest list
        id: manifest
        run: |
          VERSION="${{ needs.build-amd64.outputs.version }}"
          BASE_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          docker buildx imagetools create \
            -t "${BASE_IMAGE}:${VERSION}" \
            -t "${BASE_IMAGE}:latest" \
            "${BASE_IMAGE}:${VERSION}-amd64" \
            "${BASE_IMAGE}:${VERSION}-arm64"
          DIGEST=$(docker buildx imagetools inspect "${BASE_IMAGE}:${VERSION}" | awk '/^Digest:/ {print $2}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${BASE_IMAGE}:${VERSION}"

      - name: Promote release image tag and digest to GitOps repository
        if: env.GITOPS_PAT != ''
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_REPO_TOKEN }}
        run: |
          VERSION="${{ needs.build-amd64.outputs.version }}"
          DIGEST="${{ steps.manifest.outputs.digest }}"
          git clone "https://x-access-token:${GITOPS_PAT}@github.com/Bronsborought/python-gke-platform-gitops.git" /tmp/gitops
          python3 scripts/promote.py \
            --values-file /tmp/gitops/environments/staging/values.yaml \
            --repository "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" \
            --tag "${VERSION}" \
            --digest "${DIGEST}"
          cd /tmp/gitops
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(gitops): promoted ${VERSION} (${DIGEST}) to staging"
            git push origin main
          fi
