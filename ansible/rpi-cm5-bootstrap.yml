---
- name: Bootstrap Raspberry Pi CM5 Hybrid Edge Node
  hosts: rpi_edge
  become: true
  vars:
    edge_user: bronsborought
    lan_cidr: "192.168.88.0/24"
    docker_arch: arm64
    ubuntu_codename: noble

  tasks:
    - name: Ensure apt keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        force: false

    - name: Configure Docker CE apt repository for ARM64
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.list
        mode: "0644"
        content: |
          deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ubuntu_codename }} stable

    - name: Install required system, storage, networking, and Docker packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - jq
          - ufw
          - zram-tools
          - zfsutils-linux
          - nfs-kernel-server
          - wireguard
          - wireguard-tools
          - nvme-cli
          - smartmontools
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure edge user is in docker and adm groups
      ansible.builtin.user:
        name: "{{ edge_user }}"
        groups:
          - docker
          - adm
          - sudo
        append: true

    - name: Enable PCIe Gen 3 and external antenna in /boot/firmware/config.txt
      ansible.builtin.blockinfile:
        path: /boot/firmware/config.txt
        marker: "# {mark} ANSIBLE MANAGED CM5 EDGE HARDWARE"
        block: |
          [all]
          dtparam=ant2
          dtparam=pciex1
          dtparam=pciex1_gen=3

    - name: Configure zram swap settings
      ansible.builtin.copy:
        dest: /etc/default/zramswap
        mode: "0644"
        content: |
          ALGO=zstd
          PERCENT=50
          PRIORITY=100
      notify: Restart zramswap

    - name: Configure kernel sysctl parameters for Edge, ZFS, WireGuard, and K3s
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-cm5-edge.conf
        mode: "0644"
        content: |
          vm.swappiness = 80
          net.ipv4.ip_forward = 1
          net.ipv6.conf.all.forwarding = 1
          fs.inotify.max_user_watches = 524288
          fs.inotify.max_user_instances = 512
      notify: Apply sysctl

    - name: Harden SSH daemon (key-only authentication, disable password login)
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-cm5-hardening.conf
        mode: "0644"
        content: |
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          ChallengeResponseAuthentication no
          PermitRootLogin no
        validate: "/usr/sbin/sshd -t -f %s"
      notify: Reload ssh

    - name: Set UFW default forward policy to ACCEPT for K3s and WireGuard
      ansible.builtin.lineinfile:
        path: /etc/default/ufw
        regexp: '^DEFAULT_FORWARD_POLICY='
        line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'
      notify: Reload ufw

    - name: Allow SSH in UFW
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow WireGuard UDP port in UFW
      community.general.ufw:
        rule: allow
        port: "51820"
        proto: udp

    - name: Allow NFSv4 from local LAN in UFW
      community.general.ufw:
        rule: allow
        from_ip: "{{ lan_cidr }}"
        port: "2049"
        proto: tcp

    - name: Allow K3s API port in UFW
      community.general.ufw:
        rule: allow
        port: "6443"
        proto: tcp

    - name: Allow Node Exporter port in UFW
      community.general.ufw:
        rule: allow
        port: "9100"
        proto: tcp

    - name: Allow all traffic on WireGuard interface wg0
      community.general.ufw:
        rule: allow
        interface: wg0
        direction: in

    - name: Allow all traffic on K3s CNI interfaces
      community.general.ufw:
        rule: allow
        interface: "{{ item }}"
        direction: in
      loop:
        - cni0
        - flannel.1

    - name: Enable UFW firewall with default deny incoming
      community.general.ufw:
        state: enabled
        default: deny
        direction: incoming

    - name: Ensure core services are enabled and running
      ansible.builtin.service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - docker
        - zramswap
        - ssh

    - name: Configure Site-to-Cloud WireGuard tunnel (/etc/wireguard/wg0.conf)
      ansible.builtin.copy:
        dest: /etc/wireguard/wg0.conf
        owner: root
        group: root
        mode: '0600'
        content: |
          [Interface]
          Address = 10.200.0.2/24
          PrivateKey = {{ wg_cm5_private_key }}

          [Peer]
          # GCP VPC WireGuard Gateway (python-platform-vpc)
          PublicKey = {{ wg_gcp_public_key }}
          Endpoint = {{ wg_gcp_endpoint }}
          AllowedIPs = 10.200.0.0/24, 10.20.0.0/20
          PersistentKeepalive = 25
      when: wg_cm5_private_key is defined and wg_gcp_public_key is defined
      notify: Restart WireGuard

    - name: Enable and start WireGuard service (wg-quick@wg0)
      ansible.builtin.systemd:
        name: wg-quick@wg0
        enabled: true
        state: started
      when: wg_cm5_private_key is defined and wg_gcp_public_key is defined

    - name: Ensure GitHub Actions self-hosted runner directory exists
      ansible.builtin.file:
        path: /opt/actions-runner
        state: directory
        owner: "{{ edge_user }}"
        group: "{{ edge_user }}"
        mode: '0755'

    - name: Ensure GitHub Actions self-hosted runner systemd service is enabled and running
      ansible.builtin.systemd:
        name: actions.runner.Bronsborought-python-gke-platform.cm5-arm64-runner.service
        enabled: true
        state: started
      failed_when: false

    - name: Create ZFS storage pool datapool on NVMe partition if not present
      ansible.builtin.command: >
        zpool create -f -o ashift=12
        -O compression=zstd -O atime=off -O xattr=sa -O acltype=posixacl
        -m /srv/data datapool /dev/nvme0n1p3
      args:
        creates: /srv/data

    - name: Create ZFS datasets and enforce storage quotas (50G annotation, 20G cache)
      ansible.builtin.shell: |
        set -e
        zfs list datapool/annotation-data >/dev/null 2>&1 || zfs create -o mountpoint=/srv/data/annotation datapool/annotation-data
        zfs set quota=50G compression=zstd datapool/annotation-data
        zfs list datapool/edge-cache >/dev/null 2>&1 || zfs create -o mountpoint=/srv/data/cache datapool/edge-cache
        zfs set quota=20G compression=zstd datapool/edge-cache
      changed_when: false

    - name: Enforce rootless container UID/GID 10001:10001 permissions on ZFS annotation mountpoint
      ansible.builtin.file:
        path: /srv/data/annotation
        state: directory
        owner: "10001"
        group: "10001"
        mode: '0775'

    - name: Configure NFSv4 export for /srv/data/annotation in /etc/exports
      ansible.builtin.lineinfile:
        path: /etc/exports
        regexp: '^/srv/data/annotation\s+'
        line: '/srv/data/annotation 192.168.88.0/24(rw,sync,no_subtree_check,no_root_squash)'
        create: true
        mode: '0644'
      notify: Reload NFS exports

    - name: Create protected backup configuration directory (/etc/cm5-backup)
      ansible.builtin.file:
        path: /etc/cm5-backup
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Deploy automated ZFS encrypted backup script (/usr/local/bin/cm5-zfs-backup.sh)
      ansible.builtin.copy:
        src: ../scripts/backup_to_gcs.sh
        dest: /usr/local/bin/cm5-zfs-backup.sh
        owner: root
        group: root
        mode: '0750'

    - name: Create systemd service and daily timer for encrypted ZFS backups
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        mode: '0644'
        content: "{{ item.content }}"
      loop:
        - name: cm5-zfs-backup.service
          content: |
            [Unit]
            Description=Encrypted ZFS Incremental/Full Backup to Cloud Storage
            After=network-online.target zfs-mount.service

            [Service]
            Type=oneshot
            EnvironmentFile=-/etc/cm5-backup/backup.env
            ExecStart=/usr/local/bin/cm5-zfs-backup.sh
        - name: cm5-zfs-backup.timer
          content: |
            [Unit]
            Description=Run Encrypted ZFS Cloud Backup Daily at 02:00 UTC

            [Timer]
            OnCalendar=*-*-* 02:00:00
            Persistent=true

            [Install]
            WantedBy=timers.target

    - name: Enable daily ZFS backup systemd timer
      ansible.builtin.systemd:
        name: cm5-zfs-backup.timer
        daemon_reload: true
        enabled: true
        state: started

    - name: Install K3s single-node ARM64 server if binary is not present
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server --node-ip=10.200.0.2 --advertise-address=10.200.0.2 --tls-san=10.200.0.2 --flannel-iface=wg0 --write-kubeconfig-mode=644" sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Ensure K3s server service is enabled and running on edge node
      ansible.builtin.systemd:
        name: k3s
        enabled: true
        state: started

    - name: Install Prometheus Node Exporter package
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present
        update_cache: true

    - name: Create Node Exporter textfile collector directory
      ansible.builtin.file:
        path: /var/lib/prometheus/node-exporter
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Deploy Raspberry Pi CM5 hardware metrics collector script (throttling, NVMe SMART, ZFS)
      ansible.builtin.copy:
        dest: /usr/local/bin/cm5-hw-metrics.sh
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/bin/bash
          OUT_DIR="/var/lib/prometheus/node-exporter"
          TMP_FILE="${OUT_DIR}/cm5_hardware.prom.$$"
          FINAL_FILE="${OUT_DIR}/cm5_hardware.prom"

          THROTTLED_HEX=$(vcgencmd get_throttled 2>/dev/null | cut -d= -f2)
          [ -z "$THROTTLED_HEX" ] && THROTTLED_HEX="0x0"
          THROTTLED_DEC=$((THROTTLED_HEX))
          UNDER_VOLTAGE=$(( (THROTTLED_DEC & 0x1) != 0 ? 1 : 0 ))
          THERMAL_THROTTLED=$(( (THROTTLED_DEC & 0x8) != 0 ? 1 : 0 ))

          SOC_TEMP_MILLI=$(cat /sys/class/thermal/thermal_zone0/temp 2>/dev/null)
          [ -z "$SOC_TEMP_MILLI" ] && SOC_TEMP_MILLI="45000"
          SOC_TEMP_C=$((SOC_TEMP_MILLI / 1000)).$(( (SOC_TEMP_MILLI % 1000) / 100 ))

          NVME_TEMP=$(smartctl -A /dev/nvme0n1 2>/dev/null | awk '/^Temperature:/ {print $2}')
          NVME_WEAR=$(smartctl -A /dev/nvme0n1 2>/dev/null | awk '/^Percentage Used:/ {gsub("%","",$3); print $3}')
          [ -z "$NVME_TEMP" ] && NVME_TEMP=38
          [ -z "$NVME_WEAR" ] && NVME_WEAR=0

          ZFS_SIZE=$(zpool list -Hp -o size datapool 2>/dev/null)
          ZFS_ALLOC=$(zpool list -Hp -o alloc datapool 2>/dev/null)
          ZFS_FREE=$(zpool list -Hp -o free datapool 2>/dev/null)
          [ -z "$ZFS_SIZE" ] && ZFS_SIZE=0
          [ -z "$ZFS_ALLOC" ] && ZFS_ALLOC=0
          [ -z "$ZFS_FREE" ] && ZFS_FREE=0
          if zpool list -H -o health datapool 2>/dev/null | grep -q "ONLINE"; then
            ZFS_HEALTH=1
          else
            ZFS_HEALTH=0
          fi

          {
            echo '# HELP rpi_cm5_throttled_status_raw Raw bitmask from vcgencmd get_throttled (0 = healthy)'
            echo '# TYPE rpi_cm5_throttled_status_raw gauge'
            echo "rpi_cm5_throttled_status_raw{node=\"cm5-node\"} ${THROTTLED_DEC}"
            echo '# HELP rpi_cm5_under_voltage_active Under-voltage detected flag (1 = active, 0 = normal 27W PD)'
            echo '# TYPE rpi_cm5_under_voltage_active gauge'
            echo "rpi_cm5_under_voltage_active{node=\"cm5-node\"} ${UNDER_VOLTAGE}"
            echo '# HELP rpi_cm5_thermal_throttled_active Thermal throttling active flag (1 = throttled, 0 = normal)'
            echo '# TYPE rpi_cm5_thermal_throttled_active gauge'
            echo "rpi_cm5_thermal_throttled_active{node=\"cm5-node\"} ${THERMAL_THROTTLED}"
            echo '# HELP rpi_cm5_soc_temperature_celsius Broadcom BCM2712 SoC temperature in Celsius'
            echo '# TYPE rpi_cm5_soc_temperature_celsius gauge'
            echo "rpi_cm5_soc_temperature_celsius{node=\"cm5-node\"} ${SOC_TEMP_C}"
            echo '# HELP rpi_cm5_nvme_temperature_celsius NVMe SSD (/dev/nvme0n1) SMART composite temperature in Celsius'
            echo '# TYPE rpi_cm5_nvme_temperature_celsius gauge'
            echo "rpi_cm5_nvme_temperature_celsius{node=\"cm5-node\",device=\"nvme0n1\"} ${NVME_TEMP}"
            echo '# HELP rpi_cm5_nvme_percentage_used_ratio NVMe SSD SMART percentage used (wear level)'
            echo '# TYPE rpi_cm5_nvme_percentage_used_ratio gauge'
            echo "rpi_cm5_nvme_percentage_used_ratio{node=\"cm5-node\",device=\"nvme0n1\"} ${NVME_WEAR}"
            echo '# HELP rpi_cm5_zfs_pool_size_bytes ZFS pool total size in bytes'
            echo '# TYPE rpi_cm5_zfs_pool_size_bytes gauge'
            echo "rpi_cm5_zfs_pool_size_bytes{pool=\"datapool\"} ${ZFS_SIZE}"
            echo '# HELP rpi_cm5_zfs_pool_allocated_bytes ZFS pool allocated bytes'
            echo '# TYPE rpi_cm5_zfs_pool_allocated_bytes gauge'
            echo "rpi_cm5_zfs_pool_allocated_bytes{pool=\"datapool\"} ${ZFS_ALLOC}"
            echo '# HELP rpi_cm5_zfs_pool_free_bytes ZFS pool free bytes'
            echo '# TYPE rpi_cm5_zfs_pool_free_bytes gauge'
            echo "rpi_cm5_zfs_pool_free_bytes{pool=\"datapool\"} ${ZFS_FREE}"
            echo '# HELP rpi_cm5_zfs_pool_online_status ZFS pool ONLINE health status (1 = ONLINE, 0 = DEGRADED)'
            echo '# TYPE rpi_cm5_zfs_pool_online_status gauge'
            echo "rpi_cm5_zfs_pool_online_status{pool=\"datapool\"} ${ZFS_HEALTH}"
          } > "$TMP_FILE"
          mv "$TMP_FILE" "$FINAL_FILE"

    - name: Create systemd service for CM5 hardware metrics collection
      ansible.builtin.copy:
        dest: /etc/systemd/system/cm5-hw-metrics.service
        mode: '0644'
        content: |
          [Unit]
          Description=Collect Raspberry Pi CM5 Hardware, NVMe SMART, and ZFS Metrics for Prometheus

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/cm5-hw-metrics.sh

    - name: Create systemd timer for CM5 hardware metrics collection (every 15s)
      ansible.builtin.copy:
        dest: /etc/systemd/system/cm5-hw-metrics.timer
        mode: '0644'
        content: |
          [Unit]
          Description=Run CM5 Hardware Metrics Collector every 15 seconds

          [Timer]
          OnBootSec=5s
          OnUnitActiveSec=15s
          AccuracySec=1s

          [Install]
          WantedBy=timers.target

    - name: Enable and start CM5 hardware metrics timer and prometheus-node-exporter
      ansible.builtin.systemd:
        name: "{{ item }}"
        daemon_reload: true
        enabled: true
        state: started
      loop:
        - cm5-hw-metrics.service
        - cm5-hw-metrics.timer
        - prometheus-node-exporter

  handlers:
    - name: Restart WireGuard
      ansible.builtin.systemd:
        name: wg-quick@wg0
        state: restarted
    - name: Restart zramswap
      ansible.builtin.service:
        name: zramswap
        state: restarted

    - name: Apply sysctl
      ansible.builtin.command: sysctl --system
      changed_when: true

    - name: Reload ssh
      ansible.builtin.service:
        name: ssh
        state: reloaded

    - name: Reload ufw
      community.general.ufw:
        state: reloaded
